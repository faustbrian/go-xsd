schema_version: 1
tool_version: v2.1.1
tool_checksums_sha256: 4e0a38f76cbff547541f3164a0e59e958cf2f62d7b5cea19d7a4d1c51fe5e977
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: .verification
coverage:
  modules:
    - module: .
      mode: evidence
mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json
api:
  baselines:
    - module: .
      mode: apidiff
      path: api/v2.export
operations:
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzParseSchema$'
        budget: 5s
        count: 1
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzValidateInstance$'
        budget: 5s
        count: 1
        timeout: 2m
      - type: go-test
        packages: ["./datatype"]
        fuzz: '^FuzzParseDecimal$'
        budget: 5s
        count: 1
        timeout: 2m
      - type: go-test
        packages: ["./datatype"]
        fuzz: '^FuzzBuiltInLexical$'
        budget: 5s
        count: 1
        timeout: 2m
  - module: .
    gate: conformance
    steps:
      - type: make
        makefile: verification/package.mk
        target: conformance
        timeout: 20m
  - module: .
    gate: interoperability
    steps:
      - type: make
        makefile: verification/package.mk
        target: interoperability
        timeout: 20m
  - module: .
    gate: benchmark
    steps:
      - type: make
        makefile: verification/package.mk
        target: benchmark
        timeout: 20m
