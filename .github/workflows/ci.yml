name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      release_dry_run:
        description: Run the stable release rehearsal instead of the standard contract
        required: false
        type: boolean
        default: false
      root_coverage_diagnostic:
        description: Diagnose exact root coverage with reviewed development tooling
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  security-events: write

jobs:
  ci:
    if: github.event_name != 'workflow_dispatch' || !inputs.root_coverage_diagnostic
    uses: faustbrian/go-library-tools/.github/workflows/library-ci.yml@be0fd7d09b02c9dff29e6b00a5245ceac3cdfdfb # v1.8.5
    with:
      tooling_sha: 13d685e06cd4f01990eb95a4590ea67953a0c753
      release_dry_run: ${{ inputs.release_dry_run || false }}

  root-coverage-diagnostic:
    name: Native exact root coverage (development only)
    if: github.event_name == 'workflow_dispatch' && inputs.root_coverage_diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
    env:
      GOENV: off
      GOWORK: off
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      GOFLAGS: -p=1
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
      GOPRIVATE: ''
      GONOPROXY: ''
      GONOSUMDB: ''
    steps:
      - name: Reject release substitution
        timeout-minutes: 1
        env:
          RELEASE_DRY_RUN: ${{ inputs.release_dry_run }}
        run: |
          set -euo pipefail
          test "${RELEASE_DRY_RUN}" = false
      - name: Initialize task-owned resources
        timeout-minutes: 1
        env:
          TASK_ROOT: ${{ runner.temp }}/xsd-root-coverage-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p "${TASK_ROOT}/build" "${TASK_ROOT}/modules" "${TASK_ROOT}/tmp" "${TASK_ROOT}/lint"
          printf 'GOCACHE=%s\nGOMODCACHE=%s\nGOTMPDIR=%s\nGOLANGCI_LINT_CACHE=%s\nTMPDIR=%s\n' \
            "${TASK_ROOT}/build" "${TASK_ROOT}/modules" "${TASK_ROOT}/tmp" \
            "${TASK_ROOT}/lint" "${TASK_ROOT}/tmp" >>"${GITHUB_ENV}"
      - name: Check out exact producer with complete history
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: producer
          persist-credentials: false
          fetch-depth: 0
      - name: Check out reviewed coverage tooling
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: faustbrian/go-library-tools
          ref: 67b405ff04390d044e239cfd737c45ceb5e60447
          path: coverage-tooling
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        timeout-minutes: 5
        with:
          go-version: '1.27.0'
          cache: false
      - name: Build development coverage tooling
        timeout-minutes: 15
        working-directory: coverage-tooling
        run: go build -p 1 -trimpath -buildvcs=false -o "${GOTMPDIR}/golib" ./cmd/golib
      - name: Diagnose exact coverage for the root module only
        timeout-minutes: 25
        working-directory: producer
        run: '"${GOTMPDIR}/golib" coverage --module .'
      - name: Remove task-owned coverage resources
        if: always()
        timeout-minutes: 5
        env:
          TASK_ROOT: ${{ runner.temp }}/xsd-root-coverage-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -uo pipefail
          cleanup_status=0
          for target in "${TASK_ROOT}" "${GITHUB_WORKSPACE}/producer" "${GITHUB_WORKSPACE}/coverage-tooling"; do
            if [[ -d "${target}" ]]; then
              find "${target}" -type d -exec chmod u+w {} + || cleanup_status=1
              find "${target}" -depth -delete || cleanup_status=1
            fi
          done
          exit "${cleanup_status}"

  required:
    name: Required
    if: always()
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require shared workflow
        env:
          CI_RESULT: ${{ needs.ci.result }}
        run: test "${CI_RESULT}" = success
